# Docker Compose for EBT-Mastery
# Simplifies running experiments in containers

version: '3.8'

services:
  # GPU training service
  ebt-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: ebt-mastery:latest
    container_name: ebt-mastery-gpu
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./:/workspace/EBT-Mastery
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
    working_dir: /workspace/EBT-Mastery
    command: /bin/bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # CPU training service (fallback)
  ebt-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: ebt-mastery-cpu:latest
    container_name: ebt-mastery-cpu
    volumes:
      - ./:/workspace/EBT-Mastery
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
    working_dir: /workspace/EBT-Mastery
    command: /bin/bash
    stdin_open: true
    tty: true

  # Jupyter notebook service
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: ebt-mastery:latest
    container_name: ebt-jupyter
    runtime: nvidia
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace/EBT-Mastery
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
    working_dir: /workspace/EBT-Mastery
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

