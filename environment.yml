name: ebt
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  
  # PyTorch
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - torchaudio>=2.0.0
  - pytorch-cuda=11.8  # For CUDA 11.8, adjust as needed
  
  # Core Scientific Computing
  - numpy>=1.24.0
  - scipy>=1.11.0
  - pandas>=2.0.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - pillow>=10.0.0
  
  # Progress Bars
  - tqdm>=4.65.0
  
  # Development
  - jupyter>=1.0.0
  - ipykernel>=6.25.0
  - pytest>=7.4.0
  
  # Install remaining packages via pip
  - pip
  - pip:
    - wandb>=0.15.0
    - black>=23.0.0
    - flake8>=6.0.0
    - mypy>=1.4.0
    - ipywidgets>=8.0.0
    - scikit-learn>=1.3.0

